# =============================================================================
# RoboRacer Perception — Tunable Parameters
# =============================================================================
# Parameter names here must exactly match the declare_parameter() calls in each
# node.  RCL's YAML parser requires scalar values or block-style sequences —
# no flow sequences [] or flow mappings {} are allowed.
#
# Launch with:
#   ros2 launch roboracer_perception perception.launch.py sim:=true
#   ros2 launch roboracer_perception perception.launch.py sim:=false
# =============================================================================

# --------------------------------------------------------------------------
# lidar_processor node
# --------------------------------------------------------------------------
lidar_processor:
  ros__parameters:
    # Range filter — matches HOKUYO UST-10LX specs and f1tenth_gym_ros sim
    range_min: 0.06         # metres — sensor blind spot
    range_max: 8.0          # metres — reliable range (rated 10 m)

    # DBSCAN clustering
    # At 2 m range, adjacent rays ~8.7 mm apart.  A 228 mm cone → ~15 returns.
    dbscan_eps: 0.12        # metres — neighbourhood radius
    dbscan_min_samples: 3   # minimum cluster size

    # Cone radius validation
    cone_radius_min: 0.02   # metres — tighten to reduce false positives
    cone_radius_max: 0.15   # metres — loosen if far cones are rejected

# --------------------------------------------------------------------------
# camera_processor node  (real hardware only — not active in sim mode)
# --------------------------------------------------------------------------
camera_processor:
  ros__parameters:
    image_topic: "/zed/zed_node/rgb/image_rect_color"
    depth_topic: "/zed/zed_node/depth/depth_registered"
    info_topic:  "/zed/zed_node/rgb/camera_info"

    # HSV thresholds — tune by sampling real cone images under track lighting.
    # OpenCV ranges: H=[0,179], S=[0,255], V=[0,255]
    blue_h_low:   100
    blue_s_low:   120
    blue_v_low:    50
    blue_h_high:  130
    blue_s_high:  255
    blue_v_high:  255

    yellow_h_low:   20
    yellow_s_low:  120
    yellow_v_low:   80
    yellow_h_high:  40
    yellow_s_high: 255
    yellow_v_high: 255

    orange_h_low:    5
    orange_s_low:  150
    orange_v_low:   80
    orange_h_high:  20
    orange_s_high: 255
    orange_v_high: 255

# --------------------------------------------------------------------------
# perception_fusion node  (real hardware only)
# --------------------------------------------------------------------------
perception_fusion:
  ros__parameters:
    association_distance_m: 0.30
