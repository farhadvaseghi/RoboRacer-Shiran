# =============================================================================
# RoboRacer Perception — Tunable Parameters
# =============================================================================
# Only camera_processor reads this file in our current scenario (solid_oval
# track + tube walls + opponent). The LIDAR detector (wall_opponent_detector)
# declares its parameters with sensible defaults in code; override there if
# needed.
#
# Parameter names here must exactly match the declare_parameter() calls in
# camera_processor.py. RCL's YAML parser requires scalar values or block-style
# sequences — no flow sequences [] or flow mappings {} are allowed.
# =============================================================================

# --------------------------------------------------------------------------
# camera_processor — HSV color detection from ZED 2i (or sim_camera_walls)
# --------------------------------------------------------------------------
camera_processor:
  ros__parameters:
    image_topic: "/zed/zed_node/rgb/image_rect_color"
    depth_topic: "/zed/zed_node/depth/depth_registered"
    info_topic:  "/zed/zed_node/rgb/camera_info"

    # HSV thresholds — tune by sampling real images under track lighting.
    # OpenCV ranges: H=[0,179], S=[0,255], V=[0,255]

    # Blue — inner / left boundary tubes
    blue_h_low:   100
    blue_s_low:   120
    blue_v_low:    50
    blue_h_high:  130
    blue_s_high:  255
    blue_v_high:  255

    # Yellow — outer / right boundary tubes
    yellow_h_low:   20
    yellow_s_low:  120
    yellow_v_low:   80
    yellow_h_high:  40
    yellow_s_high: 255
    yellow_v_high: 255

    # Orange — start/finish gate (not used in the solid_wall track but kept
    # so the param schema is stable if a teammate adds gates later).
    orange_h_low:    5
    orange_s_low:  150
    orange_v_low:   80
    orange_h_high:  20
    orange_s_high: 255
    orange_v_high: 255

    # Red — opponent car body (sim_camera_walls draws it as pure BGR (0,0,255))
    red_h_low:      0
    red_s_low:    150
    red_v_low:     80
    red_h_high:    10
    red_s_high:   255
    red_v_high:   255
