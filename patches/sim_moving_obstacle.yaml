bridge:
  ros__parameters:
    ego_namespace: 'ego_racecar'
    ego_scan_topic: 'scan'
    ego_odom_topic: 'odom'
    ego_opp_odom_topic: 'opp_odom'
    ego_drive_topic: 'drive'
    opp_namespace: 'opp_racecar'
    opp_scan_topic: 'opp_scan'
    opp_odom_topic: 'odom'
    opp_ego_odom_topic: 'opp_odom'
    opp_drive_topic: 'opp_drive'

    scan_distance_to_base_link: 0.270

    scan_fov: 4.7124
    scan_beams: 1081

    map_path: 'OVERRIDDEN_BY_LAUNCH'
    map_img_ext: '.pgm'

    # Dedicated moving-obstacle scenario: enable the second simulator agent.
    num_agent: 2

    # Ego starts at the usual track start.
    sx: 0.0
    sy: 0.0
    stheta: 0.0

    # Opponent starts near the ego car but with a lateral offset so both cars
    # are visible together at launch without overlapping.
    sx1: 1.5
    sy1: 0.8
    stheta1: 0.0

    kb_teleop: False
