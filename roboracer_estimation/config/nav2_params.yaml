controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    controller_plugins: ["FollowPath"]

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 2.0
      lookahead_dist: 1.5
      min_lookahead_dist: 0.5
      max_lookahead_dist: 2.5
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 1.8
      transform_tolerance: 0.1
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.05
      use_collision_aware_lookahead: false
      allow_reversing: true
      use_rotate_to_heading: false

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [2.0, 0.0, 1.8]
    min_velocity: [-0.5, 0.0, -1.8]
    max_accel: [7.51, 0.0, 3.2]
    max_decel: [-8.26, 0.0, -3.2]
    odom_topic: /ego_racecar/odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: true
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      motion_model_for_search: "REEDS_SHEPP"
      allow_reverse_expansion: true
      # Startup vs planning-reliability balance. The 40 s startup was the R-S heuristic
      # table = lookup_table_size / costmap_resolution per side. Downsample the costmap
      # for planning (0.025 -> 0.05 m) so the table is 1/4 the cells (fast startup) while
      # keeping a large 12 m heuristic RANGE (so A* doesn't exceed max_iterations and fail
      # on far goals — the bug that made planning to (30,5.75) fail). Extra planning time
      # + iteration headroom as a safety net.
      downsample_costmap: true
      downsampling_factor: 2
      lookup_table_size: 12.0
      max_planning_time: 10.0
      max_iterations: 2000000
      max_on_approach_iterations: 5000
      minimum_turning_radius: 1.0   
      reverse_penalty: 10.0 #it was 2 before
      change_penalty: 10.0
      non_straight_penalty: 1.05
      analytic_expansion_max_length: 3.0
      smooth_path: true
      tolerance: 0.5
      allow_unknown: true

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: ego_racecar/odom
      robot_base_frame: ego_racecar/base_link
      use_sim_time: true
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      footprint: "[ [0.3, 0.2], [0.3, -0.2], [-0.1, -0.2], [-0.1, 0.2] ]"
      plugins: ["obstacle_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.3
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          clearing: true
          marking: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: ego_racecar/base_link
      use_sim_time: true
      footprint: "[ [0.3, 0.2], [0.3, -0.2], [-0.1, -0.2], [-0.1, 0.2] ]"
      resolution: 0.05
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          clearing: true
          marking: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.6
        cost_scaling_factor: 3.0
