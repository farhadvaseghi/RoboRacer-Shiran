amcl:
  ros__parameters:
    use_sim_time: false
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    global_frame_id: "map"
    scan_topic: "/scan"
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    min_particles: 1000
    max_particles: 8000
    update_min_d: 0.05
    update_min_a: 0.1
    resample_interval: 1
    transform_tolerance: 1.0
    laser_model_type: "likelihood_field"
    laser_likelihood_max_dist: 2.0
    laser_max_range: 20.0
    laser_min_range: 0.1
    max_beams: 180
    z_hit: 0.7
    z_rand: 0.3
    sigma_hit: 0.15
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    set_initial_pose: false
    tf_broadcast: true
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_slow: 0.001
    recovery_alpha_fast: 0.1
map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: "/home/roboracer/rr_maps/corridor_clean.yaml"
    topic_name: "map"
