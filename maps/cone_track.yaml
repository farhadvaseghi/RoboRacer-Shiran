# Cone track map for f1tenth_gym_ros simulation.
#
# Layout: straight track, 30 m long, 3 m wide.
#   Left boundary cones  (y = +1.5 m): x = 1, 3, 5 … 27 m  (14 cones)
#   Right boundary cones (y = -1.5 m): x = 1, 3, 5 … 27 m  (14 cones)
#   Start-gate cones: (0.5, ±1.5 m)
#
# Car spawns at world (0, 0) facing +x.

image: cone_track.pgm
resolution: 0.025          # metres per pixel
origin: [-2.0, -4.0, 0.0]  # world coords of bottom-left pixel corner
negate: 0
occupied_thresh: 0.65
free_thresh: 0.196
