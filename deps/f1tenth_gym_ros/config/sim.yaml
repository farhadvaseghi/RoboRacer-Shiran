bridge:
  ros__parameters:
    # topics and namespaces
    ego_namespace: 'ego_racecar'
    ego_scan_topic: 'scan'
    ego_odom_topic: 'odom'
    ego_opp_odom_topic: 'opp_odom'
    ego_drive_topic: 'drive'
    opp_namespace: 'opp_racecar'
    opp_scan_topic: 'opp_scan'
    opp_odom_topic: 'odom'
    opp_ego_odom_topic: 'opp_odom'
    opp_drive_topic: 'opp_drive'

    # transform related
    scan_distance_to_base_link: 0.270  # LiDAR x-offset from base_link (rear axle); confirmed from f1tenth hardware

    # laserscan parameters
    scan_fov: 4.7124   # 270° in radians (UST-10LX FOV)
    scan_beams: 1081   # UST-10LX ray count

    # map parameters
    # NOTE: map_path is overridden at launch time by gym_bridge_launch.py using
    # get_package_share_directory('roboracer_perception') — do NOT hardcode a username here.
    map_path: 'OVERRIDDEN_BY_LAUNCH'
    map_img_ext: '.pgm'

    # opponent parameters
    num_agent: 1

    # ego starting pose on map
    sx: 0.0
    sy: 0.0
    stheta: 0.0

    # opp starting pose on map
    sx1: 2.0
    sy1: 0.5
    stheta1: 0.0

    # teleop
    kb_teleop: True