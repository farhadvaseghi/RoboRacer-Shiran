bridge:
  ros__parameters:
    ego_namespace: 'ego_racecar'
    ego_scan_topic: 'scan'
    ego_odom_topic: 'odom'
    ego_opp_odom_topic: 'opp_odom'
    ego_drive_topic: 'drive'
    opp_namespace: 'opp_racecar'
    opp_scan_topic: 'opp_scan'
    opp_odom_topic: 'odom'
    opp_ego_odom_topic: 'opp_odom'
    opp_drive_topic: 'opp_drive'

    scan_distance_to_base_link: 0.270

    scan_fov: 4.7124
    scan_beams: 1081

    map_path: 'OVERRIDDEN_BY_LAUNCH'
    map_img_ext: '.pgm'

    # Set to 2 to re-enable the opponent car for dynamic overtaking experiments.
    num_agent: 1

    # Start both cars side by side like a race grid: same forward position,
    # small lateral separation, same heading.
    sx: 0.0
    sy: -0.6
    stheta: 0.0

    sx1: 0.0
    sy1: 0.6
    stheta1: 0.0

    kb_teleop: True
