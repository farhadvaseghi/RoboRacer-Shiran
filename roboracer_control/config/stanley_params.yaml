stanley_controller:
  ros__parameters:
    wheelbase: 0.3302
    stanley_k: 1.0          # CTE gain — increase to correct lateral error faster
    stanley_k_soft: 0.5     # softening constant (m/s) — prevents huge corrections at near-zero speed
    speed: 2.0
    max_steering_angle: 0.4
    goal_tolerance: 0.2
    goal_slowdown_distance: 1.0
    min_speed_near_goal: 0.4
    timer_period_sec: 0.05
    pid_kp: 0.60
    pid_ki: 0.05
    pid_kd: 0.02
    pid_integral_limit: 2.0
    pid_output_limit: 1.0
    max_speed_command: 3.0
